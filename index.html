<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Happy Birthday Ray!</title>
</head>
<body>
<section class="greeting-landing">
  <div class="greeting-container">
    <h1 class="greeting-title inspiration-regular" >Happy Birthday!</h1>
    <img src="./Assets/img/Global/red-envelope.png" alt="Invitation Image" class="invitation-mail">
    <p class="invitation-label">Click the seal to open</p>
    <div class="link-button"></div>
  </div>
</section>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inspiration&display=swap');

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body{
    width:100%;
    overflow-x:hidden;
    background:#AD1919;
  }

  .greeting-landing{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
  }

  .greeting-container{
    position:relative;

    width:min(90%, 500px);
    min-height:90%;

    background:#fff;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }

  .invitation-mail{
    width:min(75vw, 402px);
    height:auto;

    display:block; /* removes image bottom gap */
  }

  .link-button{
    position:absolute;

    width:min(75vw, 402px);
    aspect-ratio:402/289;

    top:54%;
    left:50%;
    transform:translate(-50%, -50%);
  }
</style>

<script src="./js/index.js" defer></script>

</body>
</html>
