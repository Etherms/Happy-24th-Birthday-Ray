<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ray!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="./Assets/Icons/favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.22), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(255,205,215,.24), transparent 30%),
        linear-gradient(135deg, #660707 0%, #AD1919 50%, #d64255 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      font-family: "Cormorant Garamond", serif;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .42;
      pointer-events: none;
    }

    .bg-glow.one {
      width: 260px;
      height: 260px;
      background: #ffb6c6;
      top: -90px;
      left: -80px;
    }

    .bg-glow.two {
      width: 320px;
      height: 320px;
      background: #fff1f3;
      bottom: -130px;
      right: -110px;
    }

    .heart,
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      color: rgba(255,255,255,.18);
      animation: floatHeart linear infinite;
    }

    .heart:nth-child(3) { left: 8%; font-size: 22px; animation-duration: 10s; }
    .heart:nth-child(4) { left: 25%; font-size: 30px; animation-duration: 13s; animation-delay: 1.5s; }
    .heart:nth-child(5) { left: 52%; font-size: 24px; animation-duration: 12s; animation-delay: .8s; }
    .heart:nth-child(6) { left: 73%; font-size: 20px; animation-duration: 15s; animation-delay: 2.6s; }
    .heart:nth-child(7) { left: 90%; font-size: 34px; animation-duration: 11s; animation-delay: .4s; }

    .sparkle {
      color: rgba(255,255,255,.76);
      animation: twinkle 2.5s ease-in-out infinite;
    }

    .sparkle:nth-child(8) { top: 15%; left: 15%; font-size: 13px; }
    .sparkle:nth-child(9) { top: 20%; right: 16%; font-size: 17px; animation-delay: .8s; }
    .sparkle:nth-child(10) { bottom: 18%; left: 20%; font-size: 15px; animation-delay: 1.3s; }
    .sparkle:nth-child(11) { bottom: 15%; right: 19%; font-size: 12px; animation-delay: 1.8s; }

    .password-box {
      width: 100%;
      max-width: 430px;
      min-height: 610px;
      padding: 46px 28px;
      border-radius: 34px;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow:
        0 28px 85px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.18);
      text-align: center;
      position: relative;
      z-index: 3;
      overflow: hidden;
      animation: fadeUp 1s ease forwards;
    }

    .password-box::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 26px;
      pointer-events: none;
    }

    .password-box::after {
      content: "♡";
      position: absolute;
      right: 22px;
      bottom: -8px;
      font-size: 115px;
      color: rgba(255,255,255,.07);
      transform: rotate(-18deg);
    }

    .lock-heart {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.26);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      animation: heartBeat 1.9s ease-in-out infinite;
    }

    .title {
      font-family: "Parisienne", cursive;
      font-size: clamp(60px, 16vw, 82px);
      color: white;
      font-weight: 400;
      line-height: .86;
      margin-bottom: 14px;
      text-shadow: 0 8px 24px rgba(0,0,0,.22);
    }

    .subtitle {
      color: rgba(255,255,255,.92);
      font-size: 21px;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .hint-btn {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.12);
      color: white;
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .hint-text {
      max-height: 0;
      overflow: hidden;
      color: rgba(255,255,255,.78);
      font-size: 17px;
      line-height: 1.45;
      transition: .35s ease;
    }

    .hint-text.show {
      max-height: 80px;
      margin-bottom: 18px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .password-input {
      width: 100%;
      height: 60px;
      border: none;
      outline: none;
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      padding: 0 58px 0 18px;
      font-size: 22px;
      font-family: "Cormorant Garamond", serif;
      color: #AD1919;
      transition: .3s ease;
    }

    .password-input:focus {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 4px rgba(255,255,255,.16),
        0 14px 30px rgba(0,0,0,.16);
    }

    .password-input::placeholder {
      color: #AD1919;
      opacity: .55;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(173,25,25,.1);
      color: #AD1919;
      cursor: pointer;
      font-size: 18px;
    }

    .enter-btn {
      width: 100%;
      height: 60px;
      border: none;
      outline: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #fff, #ffe7ec);
      color: #AD1919;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      font-family: "Cormorant Garamond", serif;
      transition: .3s ease;
      box-shadow: 0 16px 32px rgba(0,0,0,.18);
      position: relative;
      overflow: hidden;
    }

    .enter-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent);
      transform: translateX(-120%);
      transition: .7s ease;
    }

    .enter-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 22px 42px rgba(0,0,0,.23);
    }

    .enter-btn:hover::before {
      transform: translateX(120%);
    }

    .enter-btn:active {
      transform: scale(.98);
    }

    .error-text {
      color: #ffe0e0;
      margin-top: 18px;
      font-size: 18px;
      min-height: 24px;
    }

    .mobile-note {
      margin-top: 12px;
      color: rgba(255,255,255,.58);
      font-size: 14px;
    }

    @keyframes floatHeart {
      from {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      18% {
        opacity: 1;
      }

      to {
        transform: translateY(-130px) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes twinkle {
      0%,100% {
        opacity: .25;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.55);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(26px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heartBeat {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.14);
      }
    }

    @media(max-width: 480px) {
      body {
        padding: 14px;
      }

      .password-box {
        min-height: 88dvh;
        padding: 42px 22px;
        border-radius: 30px;
      }

      .subtitle {
        font-size: 20px;
      }

      .password-input,
      .enter-btn {
        height: 58px;
      }
    }

    @media(max-width: 360px) {
      .title {
        font-size: 56px;
      }

      .subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-glow one"></div>
  <div class="bg-glow two"></div>

  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>

  <div class="sparkle">✦</div>
  <div class="sparkle">✧</div>
  <div class="sparkle">✦</div>
  <div class="sparkle">✧</div>

  <main class="password-box">

    <div class="lock-heart">♡</div>

    <h1 class="title">
      Happy Birthday
    </h1>

    <p class="subtitle">
      I made a little surprise for someone very special.
    </p>

    <button class="hint-btn" type="button" id="hintBtn">
      Need a hint? ♡
    </button>

    <p class="hint-text" id="hintText">
      Anniversary month and date <br>
      example: 05-24
    </p>

    <div class="input-wrap">
      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="Enter password"
      >

      <button class="toggle-password" type="button" id="togglePassword" aria-label="Show password">
        ♡
      </button>
    </div>

    <button class="enter-btn" id="enterBtn">
      Open My Gift
    </button>

    <p class="error-text" id="errorText"></p>

    <p class="mobile-note">
      Tap the heart to show or hide the password
    </p>

  </main>

  <script>
    const hintBtn = document.getElementById("hintBtn");
    const hintText = document.getElementById("hintText");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("passwordInput");

    hintBtn.addEventListener("click", () => {
      hintText.classList.toggle("show");
      hintBtn.textContent = hintText.classList.contains("show")
        ? "Hide hint ♡"
        : "Need a hint? ♡";
    });

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "✧" : "♡";
    });
  </script>

  <script defer src="./js/password.js"></script>

</body>
</html>
