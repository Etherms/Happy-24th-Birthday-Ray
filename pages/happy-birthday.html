<!DOCTYPE html>
<html lang="en">
<head>

    <span>✧</span>

  <main class="greeting-container">

      <div class="date italianno-regular">
        <p>05-24-26</p>
      </div>

      <h1 class="happy-birthday-text inspiration-regular">
        Happy Birthday Ray!

      <p class="small-message gideon-roman-regular">
        I hope this little gift makes you smile today ♡

      <a href="./gift-page.html" class="link-page gideon-roman-regular">
