<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ray!</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="icon" type="image/png" href="./Assets/Icons/favicon.png">
</head>

<body>
  <script>
    if (sessionStorage.getItem("birthdayAccess") !== "granted") {
      window.location.href = "../";
    }
  </script>

  <section class="greeting-landing">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <span class="floating-heart heart-1">♡</span>
    <span class="floating-heart heart-2">♡</span>
    <span class="floating-heart heart-3">♡</span>
    <span class="floating-heart heart-4">♡</span>
    <span class="sparkle sparkle-1">✦</span>
    <span class="sparkle sparkle-2">✧</span>
    <span class="sparkle sparkle-3">✦</span>

    <div class="greeting-container">
      <p class="small-text gideon-roman-regular">A little surprise for you</p>

      <h1 class="greeting-title inspiration-regular">
        Happy Birthday!
      </h1>

      <div class="envelope-wrap">
        <img 
          src="../Assets/img/Global/red-envelope.png" 
          alt="Invitation Image" 
          class="invitation-mail"
        >

        <button
          class="link-button"
          onclick="window.location.href='./happy-birthday.html'"
          aria-label="Open birthday letter"
        ></button>
      </div>

      <p class="invitation-label gideon-roman-regular">
        Tap the seal to open your gift ♡
      </p>
    </div>
  </section>
</body>
</html>
